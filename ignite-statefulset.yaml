apiVersion: apps/v1
kind: StatefulSet
metadata:
  # The cluster name.
  name: gridgain-cluster
  # Place your namespace name.
  namespace: ignite
spec:
  # The initial number of pods to be started by Kubernetes.
  replicas: 2
  # Kubernetes service to access the GridGain 9 cluster on the Kubernetes network.
  serviceName: gridgain-svc-headless
  selector:
    matchLabels:
      app: gridgain
  template:
    metadata:
      labels:
        app: gridgain
    spec:
      terminationGracePeriodSeconds: 60000
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        seLinuxOptions:
          level: "s0:c123,c456"
        runAsUser: 5000
        runAsGroup: 5000
        fsGroup: 5000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        # Custom pod name.
      - name: gridgain-node
        # Limits and requests for the GridGain container.
#         resources:
#           limits:
#             cpu: "4"
#             memory: 4Gi
#           requests:
#             cpu: "4"
#             memory: 4Gi
        env:
          # Must be specified to ensure that GridGain 9 cluster replicas are visible to each other.
          - name: GRIDGAIN_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          # GridGain 9 working directory.
          - name: GRIDGAIN_WORK_DIR
            value: /gg9-work
          # the CLI needs a writable directory. won't be needed after IGNITE-26538
          - name: GRIDGAIN9_OPTS
            value: -Duser.home=/gg9-work
        # GridGains Docker image and it's version.
        image: gridgain/gridgain9:9.1.9
        securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        ports:
        - containerPort: 10300
        - containerPort: 10800
        - containerPort: 3344
        volumeMounts:
        # The config will be placed at this path in the container.
        - mountPath: /opt/gridgain/etc/gridgain-config.conf
          name: config-vol
          subPath: gridgain-config.conf
        # The license will be placed at this path in the container.
        - mountPath: /opt/gridgain/etc/gridgain-license.json
          name: license-vol
          subPath: gridgain-license.json
        - mountPath: /opt/gridgain/etc/auth-config.conf
          name: auth-vol
          subPath: auth-config.conf
        # GridGain 9 working directory.
        - mountPath: /gg9-work
          name: persistence
        - mountPath: /opt/gridgain/work/etc
          name: config
      volumes:
      - name: config-vol
        configMap:
          name: gridgain-config
      - name: license-vol
        configMap:
          name: gridgain-license
      - name: auth-vol
        configMap:
          name: auth-config
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: persistence
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi # Provide enough space for your application data.
      volumeMode: Filesystem
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: config
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Mi
      volumeMode: Filesystem